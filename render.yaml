services:
  # 1. Backend Web Service (FastAPI + Uvicorn)
  - type: web
    name: ai-study-buddy-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://ai-study-buddy-frontend.onrender.com"

  # 2. Frontend Web Service (Static React SPA)
  - type: web
    name: ai-study-buddy-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
